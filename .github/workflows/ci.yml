name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 major 이동 태그(v9)를 발행하지 않으므로 정확한 버전으로 고정한다.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dashboard extra
        run: uv sync --locked --python 3.13 --extra dashboard

      - name: Run dashboard tests
        run: >-
          uv run pytest -v
          tests/test_dashboard_data.py
          tests/test_dashboard_cli.py
          tests/test_dashboard_app.py
          tests/test_package.py

      - name: Build wheel
        run: uv build

      - name: Smoke console script from built wheel
        run: |
          WHEEL="$(find dist -name 'deeptool-*.whl' -print -quit)"
          uv run --no-project --isolated --with "$WHEEL[dashboard]" \
            deeptool-dashboard --help
