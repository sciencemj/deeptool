name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 major 이동 태그(v9)를 발행하지 않으므로 정확한 버전으로 고정한다.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check release tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # sed 를 쓰는 이유: BSD/GNU 양쪽에서 같게 동작해 개발 머신(macOS)에서
          # 그대로 검증할 수 있다. grep -oP 는 macOS 기본 grep 에 없어 검증이 안 된다.
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' deeptool/__init__.py)"
          echo "tag=$TAG version=$VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::deeptool/__init__.py 에서 __version__ 을 읽지 못했습니다"
            exit 1
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::릴리스 태그 $TAG 와 deeptool/__init__.py 의 __version__ $VERSION 이 다릅니다"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
